[package]
name = "ineed-linklab-tauri"
version = "0.1.0"
description = "Ineed LinkLab desktop shell"
authors = ["Ineed"]
edition = "2021"
license = "Apache-2.0"
default-run = "ineed-linklab-tauri"

[workspace]
members = ["vendor/async-opcua-server"]
default-members = ["."]
resolver = "2"

[lib]
name = "ineed_linklab_tauri"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
async-opcua = { version = "=0.19.0", features = ["client", "server"] }
chrono = "0.4"
futures = "0.3"
sha2 = "0.10"
base64 = "0.22.1"
libc = "0.2.186"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
serialport = "4.9.0"
socket2 = "0.6.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-modbus = { version = "0.17.0", features = ["rtu-sync", "tcp-sync", "rtu-server", "tcp-server"] }
tokio-serial = "5.4.5"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2"
tokio-util = { version = "0.7", features = ["rt"] }

# Preserve all upstream certificate checks; fix URI SAN ordering in 0.19.0.
[patch.crates-io]
async-opcua-crypto = { path = "vendor/async-opcua-crypto" }
# Keep deferred samples scheduled until their sampling timestamp is due.
async-opcua-server = { path = "vendor/async-opcua-server" }
